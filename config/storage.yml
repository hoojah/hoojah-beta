test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

cloudinary:
  service: Cloudinary

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket

# Use rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
# Browser DIRECT UPLOADS PUT straight to this endpoint cross-origin, so the bucket
# MUST carry a CORS policy or the browser preflight fails ("Response to preflight
# request doesn't pass access control check") even after CSP allows the host. Apply
# once per bucket (serving is same-origin via the Active Storage proxy, so only the
# upload PUT needs CORS):
#   bin/rails garage:cors      # uses the GARAGE_* env + bundled aws-sdk-s3 (no aws CLI)
# or, with the aws CLI if you have it:
#   aws --endpoint-url "$GARAGE_ENDPOINT" s3api put-bucket-cors --bucket "$GARAGE_BUCKET" \
#     --cors-configuration '{"CORSRules":[{"AllowedOrigins":["https://hoojah.rudzainy.com"],
#     "AllowedMethods":["PUT"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
garage:
  service: S3
  endpoint: <%= ENV.fetch("GARAGE_ENDPOINT", "https://s3-grg.novas.my") %>
  access_key_id: <%= ENV["GARAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["GARAGE_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["GARAGE_BUCKET"] %>
  region: <%= ENV.fetch("GARAGE_REGION", "garage") %>
  force_path_style: true
