<?xml version="1.0" encoding="utf-8"?>
<!-- Hoojah brand MARK: the leftmost "h" glyph of logo.svg, lifted verbatim (same path
     data, same 0..28 vertical box so it renders at the SAME height as the wordmark at a
     given CSS height). Used in the navbar below `sm`, where the full wordmark does not
     fit alongside the user menu + actions. The wordmark's gradient is a radial centred on
     the whole word (so an isolated glyph would read solid blue); here it's a diagonal
     green→blue over the letter itself, keeping the two brand hues. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 14 28" xml:space="preserve">
  <linearGradient id="hoojah_mark" x1="0" y1="21.7" x2="13" y2="0.1" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00E915"/>
    <stop offset="0.7" stop-color="#007BFF"/>
  </linearGradient>
  <path fill="url(#hoojah_mark)" d="M13,21.4v-9c0-1.9-0.4-3.4-1.4-4.5c-0.9-1-2.3-1.5-4.1-1.5c-2.3,0-4.1,1-5.1,2.8l0.3,0.1h0.3
    V0.1H0v21.6h2.9v-8.5c0-1.3,0.4-2.3,1.1-3.1c0.8-0.8,1.7-1.2,3-1.2c1.1,0,1.8,0.3,2.3,0.9c0.5,0.6,0.8,1.4,0.8,2.7v9.2H13V21.4"/>
</svg>
